name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (stickman library)
        run: npx eslint src/stickman
      - name: Unit + integration tests
        run: npm test
      - name: Smoke render (stickman still)
        run: npx remotion still StickmanVideo out/smoke.png --frame=90 --props='{"project":"stickman-demo"}'
